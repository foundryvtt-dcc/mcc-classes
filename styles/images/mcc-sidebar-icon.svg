<!-- Mutant Crawl Classics "M" tab-strip icon: letterform in the logo's
     trade-dress style (chunky upright block letter, green fill, thick
     yellow outline, thin dark-green outer edge) drawn by hand — the logo
     art's letters overlap, so a clean crop isn't possible, and no bundled
     font matches the lettering. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 132 172">
